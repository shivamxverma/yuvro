apiVersion: v1
kind: ServiceAccount
metadata:
  name: orchestrator
  namespace: yuvro
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: orchestrator
  namespace: yuvro
rules:
  - apiGroups: [""]
    resources: ["services"]
    verbs: ["get", "list", "watch", "create", "patch", "update"]
  - apiGroups: [""]
    resources: ["secrets", "persistentvolumeclaims"]
    verbs: ["get", "list", "watch", "create", "patch", "update"]
  - apiGroups: ["apps"]
    resources: ["deployments"]
    verbs: ["get", "list", "watch", "create", "patch", "update"]
  - apiGroups: ["networking.k8s.io"]
    resources: ["ingresses"]
    verbs: ["get", "list", "watch", "create", "patch", "update"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: orchestrator
  namespace: yuvro
subjects:
  - kind: ServiceAccount
    name: orchestrator
    namespace: yuvro
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: orchestrator
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: orchestrator
  namespace: yuvro
spec:
  replicas: 1
  selector:
    matchLabels:
      app: orchestrator
  template:
    metadata:
      labels:
        app: orchestrator
    spec:
      serviceAccountName: orchestrator
      volumes:
        - name: workspace-root
          hostPath:
            path: /workspaces-host
            type: DirectoryOrCreate
      containers:
        - name: orchestrator
          image: yuvro-orchestrator:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 3002
          env:
            - name: PORT
              value: "3002"
            - name: WORKSPACES_DIR
              value: /workspaces-host
            - name: K8S_NAMESPACE
              value: yuvro
            - name: K8S_BASE_DOMAIN
              value: 127.0.0.1.nip.io
            - name: K8S_INGRESS_SCHEME
              value: http
            - name: K8S_INGRESS_PORT
              value: "8080"
            - name: K8S_WORKSPACE_ROOT
              value: /workspaces-host
            - name: K8S_RUNNER_IMAGE
              value: yuvro-runner:latest
            - name: K8S_RUNNER_IMAGE_PULL_POLICY
              value: IfNotPresent
            - name: K8S_DB_STORAGE_SIZE
              value: 5Gi
          volumeMounts:
            - name: workspace-root
              mountPath: /workspaces-host
---
apiVersion: v1
kind: Service
metadata:
  name: orchestrator
  namespace: yuvro
spec:
  selector:
    app: orchestrator
  ports:
    - port: 3002
      targetPort: 3002
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: orchestrator
  namespace: yuvro
spec:
  ingressClassName: nginx
  rules:
    - host: orchestrator.127.0.0.1.nip.io
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: orchestrator
                port:
                  number: 3002
