apiVersion: batch/v1
kind: CronJob
metadata:
  name: init-service-cas-gc
  namespace: yuvro
spec:
  schedule: "0 * * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 2
  failedJobsHistoryLimit: 2
  jobTemplate:
    spec:
      backoffLimit: 1
      template:
        spec:
          restartPolicy: OnFailure
          containers:
            - name: cas-gc
              image: yuvro-init-service:latest
              imagePullPolicy: IfNotPresent
              command:
                - python
                - scripts/run_cas_gc.py
              env:
                - name: DATABASE_URL
                  value: "postgresql+psycopg2://postgres:postgres@postgres:5432/yuvro"
                - name: CAS_GC_GRACE_HOURS
                  value: "168"
                - name: CAS_GC_BATCH_SIZE
                  value: "500"
                - name: S3_BUCKET
                  valueFrom:
                    secretKeyRef:
                      name: yuvro-app-secrets
                      key: S3_BUCKET
                      optional: true
                - name: AWS_ACCESS_KEY_ID
                  valueFrom:
                    secretKeyRef:
                      name: yuvro-app-secrets
                      key: AWS_ACCESS_KEY_ID
                      optional: true
                - name: AWS_SECRET_ACCESS_KEY
                  valueFrom:
                    secretKeyRef:
                      name: yuvro-app-secrets
                      key: AWS_SECRET_ACCESS_KEY
                      optional: true
                - name: S3_ENDPOINT
                  valueFrom:
                    secretKeyRef:
                      name: yuvro-app-secrets
                      key: S3_ENDPOINT
                      optional: true
