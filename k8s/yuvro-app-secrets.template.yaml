apiVersion: v1
kind: Secret
metadata:
  name: yuvro-app-secrets
  namespace: yuvro
type: Opaque
stringData:
  # Required for CAS uploads and CAS garbage collection.
  S3_BUCKET: "replace-me"
  AWS_ACCESS_KEY_ID: "replace-me"
  AWS_SECRET_ACCESS_KEY: "replace-me"

  # Optional for S3-compatible providers such as MinIO.
  S3_ENDPOINT: ""

  # Optional unless you want to call POST /admin/cas-gc manually.
  ADMIN_API_TOKEN: "replace-me-with-a-long-random-token"
