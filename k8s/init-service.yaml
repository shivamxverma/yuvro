apiVersion: apps/v1
kind: Deployment
metadata:
  name: init-service
  namespace: yuvro
spec:
  replicas: 1
  selector:
    matchLabels:
      app: init-service
  template:
    metadata:
      labels:
        app: init-service
    spec:
      volumes:
        - name: workspace-root
          hostPath:
            path: /workspaces-host
            type: DirectoryOrCreate
      containers:
        - name: init-service
          image: yuvro-init-service:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 3001
          env:
            - name: PORT
              value: "3001"
            - name: CLIENT_ORIGIN
              value: "http://localhost:5173"
            - name: DATABASE_URL
              value: "postgresql+psycopg2://postgres:postgres@postgres:5432/yuvro"
            - name: WORKSPACES_DIR
              value: /workspaces-host
            - name: TEMPLATES_DIR
              value: /init-service/runner/templates
            - name: TEMPLATE_MANIFESTS_DIR
              value: /init-service/runner/template_manifests
            - name: S3_BUCKET
              valueFrom:
                secretKeyRef:
                  name: yuvro-app-secrets
                  key: S3_BUCKET
                  optional: true
            - name: AWS_ACCESS_KEY_ID
              valueFrom:
                secretKeyRef:
                  name: yuvro-app-secrets
                  key: AWS_ACCESS_KEY_ID
                  optional: true
            - name: AWS_SECRET_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: yuvro-app-secrets
                  key: AWS_SECRET_ACCESS_KEY
                  optional: true
            - name: S3_ENDPOINT
              valueFrom:
                secretKeyRef:
                  name: yuvro-app-secrets
                  key: S3_ENDPOINT
                  optional: true
            - name: ADMIN_API_TOKEN
              valueFrom:
                secretKeyRef:
                  name: yuvro-app-secrets
                  key: ADMIN_API_TOKEN
                  optional: true
          volumeMounts:
            - name: workspace-root
              mountPath: /workspaces-host
---
apiVersion: v1
kind: Service
metadata:
  name: init-service
  namespace: yuvro
spec:
  selector:
    app: init-service
  ports:
    - port: 3001
      targetPort: 3001
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: init-service
  namespace: yuvro
spec:
  ingressClassName: nginx
  rules:
    - host: init-service.127.0.0.1.nip.io
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: init-service
                port:
                  number: 3001
